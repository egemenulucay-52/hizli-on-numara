name: Kod Dogrulama

on:
  push:
    paths:
      - "**.py"
      - "requirements*.txt"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "**.py"
      - "requirements*.txt"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kodlari Klonla
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-bot.txt

      - name: Bagimliliklari Yukle
        run: pip install -r requirements.txt -r requirements-bot.txt

      - name: Birim Testlerini Calistir
        run: python -m unittest discover -s tests -v
